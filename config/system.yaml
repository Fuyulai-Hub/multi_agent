# =============================================================================
# 多 Agent 任务协作系统 —— 全局入口配置
# 通过 --config / --profile 可切换整套配置，实现“配置驱动”的运行形态
# =============================================================================
system:
  name: "配置驱动多 Agent 任务协作系统"
  version: "1.0.0"
  description: >-
    Leader 统一调度的流水线架构：产品(需求评估) → 研发(方案设计/编码) → 评审(代码审查)
    → 测试(业务测试/bug) → 研发(缺陷修复) → 验收(门禁) → 报告(证据与验收报告)
  workspace: "workspace"          # 运行产物根目录（相对项目根，可被 CLI --workspace 覆盖）
  default_profile: null           # 可设为 strict / lean 等 profiles 下的配置
  requirement_encoding: "utf-8"

# LLM 提供方：offline 为内置确定性 Provider（无 Key 也能端到端跑通），
# openai_compatible 走标准 /chat/completions 接口处理任意需求
llm:
  provider: "openai_compatible"
  # 该端点实测可用模型：DeepSeek（推荐）/ Qwen / GLM。
  # Qwen 与 GLM 在 implement/optimize 这类长 JSON 生成任务上会把预算耗在思考链里，返回空正文。
  model: "DeepSeek"
  base_url: "https://api.chat.csu.edu.cn/v1"
  # API Key / BASE_URL 不写在本文件里，按优先级外注（后者覆盖前者）：
  #   1) config/credentials.yaml（本地凭据文件，前端「设为默认」写入）
  #   2) 环境变量：下方 api_key_env / base_url_env 指定的变量名
  #   3) 运行时注入：前端表单单次运行、CLI --api-key/--base-url
  # 这里刻意用项目专属变量名（MAS_LLM_*），避免被系统里已存在的 OPENAI_API_KEY 顶掉
  base_url_env: "MAS_LLM_BASE_URL"
  api_key_env: "MAS_LLM_API_KEY"
  temperature: 0.2
  max_tokens: 64000          # 实现/测试类任务（多文件全量代码 + 用例）需 2~6 万输出 token；推理模型的思考链计入本预算，16000 会被思考链吃光导致正文为空/截断。流式下生成时长不受网关 300s 限制（客户端 timeout=600s 仍为单次尝试上限）
  stream: true               # 必须流式：非流式下网关 300s 上限按请求总时长计，implement 长生成三次降级尝试全部 504（实测 3×300s 空输出）；流式 TTFB<1s、chunk 间隔远小于 300s
  # —— 思考预算治理 ——
  # 实测（本端点，GLM）：implement 长 JSON 任务思考链 60735 字符打满 max_tokens=16000 →
  # finish_reason=length、正文 0 字符、耗时 221s；下发 reasoning_effort=low 后同一任务
  # 35s 返回 12620 字符正文（finish_reason=stop）。思考链确实计入 max_tokens 输出预算。
  reasoning_effort: ""              # 空=不下发（保持端点默认）；可填 low / medium / high
  # 降级阶梯：结果不可用时依次尝试的思考强度（逗号分隔或 YAML 列表）。
  # 顺序按实测耗时排：low ≈33s（距网关 300s 上限余量约 9 倍）→ high ≈115s（余量约 2.6 倍，但同样能收敛）。
  # "不可用" = 被预算截断(length) / 网关 504 超时；降级档另含 空正文 / 解析不出 JSON。
  downgrade_reasoning_effort: "low,high"
  empty_output_retry: 2             # 最多降级重发几次（0=关闭降级）；与上面的阶梯长度取小者生效
  timeout: 600            # 该端点单次响应实测 150~200s（超时 120s 会导致 implement/optimize 读超时）
  # function calling（默认关闭）：开启后从 config/mcp.yaml 的 enabled 服务拉取工具清单，
  # 以 OpenAI tools 格式随请求下发；模型返回 tool_calls 时由 ToolRunner 真实执行并回传。
  # 注意：tools 与 response_format(json_object) 互斥，开启后 JSON 约束改由 Prompt 契约保证。
  tools_enabled: false
  tool_choice: "auto"         # auto | required | {"type":"function","function":{"name":...}}
  tool_max_rounds: 2          # 单次生成的工具调用闭环轮数上限
  # 网络重试：默认 1（不重试，保持既有行为）；端点不稳定时按需开启（仅重试网络错误与 429/5xx）
  retry:
    max_attempts: 1
    backoff_s: 2.0
  # 上下文窗口（token）：端点不返回该值，前端"已用/总量"进度条用。
  # 平台公告：模型名不再含版本号（DeepSeek / Qwen / GLM / Embedding / Reranker），
  # 上下文大小随资源调整、当前均不超过 256K，故默认取 262144；可在前端「模型配置」弹窗修改。
  context_window: 262144
  offline:
    package_name: "order_pricing"        # 交付包名（技术约束中声明的 import 名）
    inject_first_pass_defect: true       # 首轮实现注入真实缺陷，用于演示 bug→修复→回归闭环
    defect_ops: ["calc_shipping"]        # 需要注入缺陷的功能点算子
    strip_first_pass_docstrings: true    # 首轮草稿缺少文档字符串，用于演示代码审查回退
    consult_defaults: true               # 允许研发在协商中给出契约化答复

runtime:
  python: "python"
  sandbox_timeout: 180            # 单次沙箱执行超时（秒）
  # 沙箱命令白名单：只放行 Python 解释器（含绝对路径/版本号变体），拒绝 shell 解释器
  sandbox_command_policy:
    enabled: true
    allowed: ["python", "python3", "py"]
  sandbox_strip_sensitive_env: true   # 剔除含 KEY/TOKEN/SECRET 等词的环境变量再进沙箱
  # POSIX 资源限制（Windows 无标准库等价方案，自动跳过并在事件中标注）
  sandbox_limits:
    cpu_seconds: 300
    address_space_bytes: 1073741824
    file_size_bytes: 67108864
    max_processes: 128
  # 静态分析并行度（按文件并行，IO 等待型负载；不配则用默认 min(8, cpu+4)）
  sandbox_analyze_workers: null
  save_prompts: true              # 落盘每次 Prompt（含分层经验注入证据）
  prompt_artifact_max_chars: 10000  # Prompt 感知段单产物最大字符数：默认 900 会把 12 功能点的需求规格截到只剩 3 个 FP 片段（研发/测试/审查全程信息残缺，实测根因之一）
  max_steps: 40                   # 单次运行最大状态推进步数（防死循环）
  run_id_format: "%Y%m%d-%H%M%S"
  fail_fast: false
  verbose: true

files:
  flow: "flow.yaml"
  collaboration: "collaboration.yaml"
  learning: "learning.yaml"
  roles_dir: "roles"
  profiles_dir: "profiles"
