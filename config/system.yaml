# =============================================================================
# 多 Agent 任务协作系统 —— 全局入口配置
# 通过 --config / --profile 可切换整套配置，实现“配置驱动”的运行形态
# =============================================================================
system:
  name: "配置驱动多 Agent 任务协作系统"
  version: "1.0.0"
  description: >-
    Leader 统一调度的流水线架构：产品(需求评估) → 研发(方案设计/编码) → 评审(代码审查)
    → 测试(业务测试/bug) → 研发(缺陷修复) → 验收(门禁) → 报告(证据与验收报告)
  workspace: "workspace"          # 运行产物根目录（相对项目根，可被 CLI --workspace 覆盖）
  default_profile: null           # 可设为 strict / lean 等 profiles 下的配置
  requirement_encoding: "utf-8"

# LLM 提供方：offline 为内置确定性 Provider（无 Key 也能端到端跑通），
# openai_compatible 走标准 /chat/completions 接口处理任意需求
llm:
  provider: "openai_compatible"
  # 该端点实测可用模型：DeepSeek（推荐）/ Qwen / GLM。
  # Qwen 与 GLM 在 implement/optimize 这类长 JSON 生成任务上会把预算耗在思考链里，返回空正文。
  model: "DeepSeek"
  base_url: "https://api.chat.csu.edu.cn/v1"
  # API Key / BASE_URL 不写在本文件里，按优先级外注（后者覆盖前者）：
  #   1) config/credentials.yaml（本地凭据文件，前端「设为默认」写入）
  #   2) 环境变量：下方 api_key_env / base_url_env 指定的变量名
  #   3) 运行时注入：前端表单单次运行、CLI --api-key/--base-url
  # 这里刻意用项目专属变量名（MAS_LLM_*），避免被系统里已存在的 OPENAI_API_KEY 顶掉
  base_url_env: "MAS_LLM_BASE_URL"
  api_key_env: "MAS_LLM_API_KEY"
  temperature: 0.2
  max_tokens: 64000          # 实现/测试类任务（多文件全量代码 + 用例）需 2~6 万输出 token；推理模型的思考链计入本预算，16000 会被思考链吃光导致正文为空/截断。流式下生成时长不受网关 300s 限制（客户端 timeout=600s 仍为单次尝试上限）
  stream: true               # 必须流式：非流式下网关 300s 上限按请求总时长计，implement 长生成三次降级尝试全部 504（实测 3×300s 空输出）；流式 TTFB<1s、chunk 间隔远小于 300s
  # —— 思考预算治理 ——
  # 实测（本端点，GLM）：implement 长 JSON 任务思考链 60735 字符打满 max_tokens=16000 →
  # finish_reason=length、正文 0 字符、耗时 221s；下发 reasoning_effort=low 后同一任务
  # 35s 返回 12620 字符正文（finish_reason=stop）。思考链确实计入 max_tokens 输出预算。
  reasoning_effort: ""              # 空=不下发（保持端点默认）；可填 low / medium / high
  # 降级阶梯：结果不可用时依次尝试的思考强度（逗号分隔或 YAML 列表）。
  # 顺序按实测耗时排：low ≈33s（距网关 300s 上限余量约 9 倍）→ high ≈115s（余量约 2.6 倍，但同样能收敛）。
  # "不可用" = 被预算截断(length) / 网关 504 超时；降级档另含 空正文 / 解析不出 JSON。
  downgrade_reasoning_effort: "low,high"
  empty_output_retry: 2             # 最多降级重发几次（0=关闭降级）；与上面的阶梯长度取小者生效
  timeout: 600            # 该端点单次响应实测 150~200s（超时 120s 会导致 implement/optimize 读超时）
  # function calling（默认开启，可在前端「模型配置」弹窗关闭）：开启后从 config/mcp.yaml 的
  # enabled 服务拉取工具清单，以 OpenAI tools 格式随请求下发；模型返回 tool_calls 时由
  # ToolRunner 真实执行并回传。无任何工具源时自动降级为无工具运行（发告警事件）。
  # 注意：tools 与 response_format(json_object) 互斥，开启后 JSON 约束改由 Prompt 契约保证。
  tools_enabled: true
  tool_choice: "auto"         # auto | required | {"type":"function","function":{"name":...}}
  tool_max_rounds: 2          # 单次生成的工具调用闭环轮数上限
  tools_nodes: ["intake"]     # 下发 tools 的节点白名单（空列表=全部节点=改造前行为）。
                              # 默认只对 intake 生效：下游节点保持 json_mode 强制 JSON 契约
                              # （tools 与 response_format 互斥，见 docs/16 的 05 文档 §4.3）
  # 图片输入（docs/16 的 01 文档）：默认关闭，行为与现状逐字节一致。
  # 端点是否接受 image_url content parts 属未验证项（需先按最小请求探测），故默认 false；
  # 开启后若收到 400 且错误详情提及 image/multimodal/vision，自动去图重发一次（degraded 留痕）。
  vision:
    enabled: false
    max_image_bytes: 5242880  # 单张上限 5MB
    url_style: "data_uri"     # data_uri | raw_base64（按端点实测调整）
  # 网络重试：默认 3 次。实测 2026-10-16 两次运行在 intake 首调即遭遇 TCP 级失败
  # （WinError 10054 连接被重置 / 10061 拒连），max_attempts=1 下瞬时端点抖动一次致命，
  # 整轮 6 秒判 fail。连接类异常（10054/10061）已在 mas/llm.py 纳入可重试分类。
  retry:
    max_attempts: 3
    backoff_s: 3.0
  # 上下文窗口（token）：端点不返回该值，前端"已用/总量"进度条用。
  # 平台公告：模型名不再含版本号（DeepSeek / Qwen / GLM / Embedding / Reranker），
  # 上下文大小随资源调整、当前均不超过 256K，故默认取 262144；可在前端「模型配置」弹窗修改。
  context_window: 262144
  offline:
    package_name: "order_pricing"        # 交付包名（技术约束中声明的 import 名）
    inject_first_pass_defect: true       # 首轮实现注入真实缺陷，用于演示 bug→修复→回归闭环
    defect_ops: ["calc_shipping"]        # 需要注入缺陷的功能点算子
    strip_first_pass_docstrings: true    # 首轮草稿缺少文档字符串，用于演示代码审查回退
    consult_defaults: true               # 允许研发在协商中给出契约化答复

runtime:
  python: "python"
  sandbox_timeout: 180            # 单次沙箱执行超时（秒）
  # 沙箱命令白名单：放行 Python 解释器（含绝对路径/版本号变体）与 node（docs/15 B1，
  # 供 web_fullstack 需求的 JS 交付验证）；shell 解释器仍被硬拒，不受白名单影响
  sandbox_command_policy:
    enabled: true
    allowed: ["python", "python3", "py", "node"]
  sandbox_strip_sensitive_env: true   # 剔除含 KEY/TOKEN/SECRET 等词的环境变量再进沙箱
  # POSIX 资源限制（Windows 无标准库等价方案，自动跳过并在事件中标注）
  sandbox_limits:
    cpu_seconds: 300
    address_space_bytes: 1073741824
    file_size_bytes: 67108864
    max_processes: 128
  # 执行后端（docs/37 P0-1）：
  #   local     = 宿主进程。只有路径/命令/环境/rlimit 约束，不是安全边界，适合本地开发；
  #   container = Docker/Podman。--network none、只读根、cap-drop ALL、no-new-privileges、
  #               内存/CPU/pids 上限，只挂载本次 run 的 code/ 目录。
  # backend=container 时初始化即校验运行时与镜像；任一不可用直接失败（fail-closed），
  # 绝不静默降级到宿主执行。镜像需自带交付物所需解释器（默认 python，node 需求请换镜像）。
  sandbox_backend: "local"
  sandbox_container:
    runtime: "docker"              # 可执行文件名或绝对路径（podman 亦可）
    image: "python:3.12-slim"
    python: "python"               # 容器内解释器名（宿主绝对路径会被映射成它）
    network: "none"                # 生产保持 none；改成 bridge 即失去网络隔离
    memory: "1g"
    cpus: "1.0"
    pids_limit: 128
    read_only: true                # 根文件系统只读，/tmp 用 tmpfs
    tmpfs: "/tmp:rw,noexec,nosuid,size=64m"
    user: ""                       # 空=POSIX 当前 uid:gid；Windows 交给 Docker Desktop
  # 验证凭据签名（docs/37 P0-2 / 门径优化）：
  #   release_mode=true 时必须有稳定的 MAS_VERIFIER_SECRET（>=32 字符），
  #   缺失/过短时 Leader 启动即拒绝，绝不退回进程随机密钥；
  #   也可用 MAS_VERIFIER_RELEASE=1 或 MAS_ENV=release/prod/production 触发 release。
  #   dev 模式允许进程随机密钥（重启后旧 manifest/attestation 失效，属预期）。
  #   生产建议把 HMAC 换为 Ed25519 或云 KMS 签名（见 mas/verifier.py 文件头）。
  verifier:
    release_mode: false
  # 静态分析并行度（按文件并行，IO 等待型负载；不配则用默认 min(8, cpu+4)）
  sandbox_analyze_workers: null
  # UI 证据采集（docs/15 方案 B）：默认关闭，行为与现状一致。
  # 启用后 tester 对 delivery_mode=web_fullstack 且声明了浏览器级验证的需求，
  # 经 config/mcp.yaml 中注册的浏览器 MCP 服务（如 playwright）采集 UI 证据，
  # 产出 ui_evidence artifact 供验收门禁第 9 条判定。
  ui_probe:
    enabled: false
    server: "playwright"          # mcp.yaml 中已注册且 enabled 的服务名
    timeout: 300                  # 单次 UI 探测总超时（秒），独立于 sandbox_timeout
  # 项目指令文件（docs/36，对标 Codex 的 AGENTS.md）：从需求文件所在目录向上逐级收集到
  # 项目根，注入每个节点的 Prompt；文件头部可选 YAML front-matter，其中 delivery_shape
  # 由框架确定性采纳（优先于模型判定）。没有该文件时整段为空，Prompt 与未启用时逐字节一致。
  project_docs:
    enabled: true
    max_bytes: 32768               # 累积上限（字节），与 Codex 的 32 KiB 一致，超限即停
  save_prompts: true              # 落盘每次 Prompt（含分层经验注入证据）
  # 技能注入（config/skills/*/SKILL.md → 节点 Prompt）：默认开启。
  # 关闭时 Prompt 与改造前逐字节一致；开启后每个节点执行前做确定性匹配（规则见 mas/skills.py 的 score_skill）：
  #   trigger.requires_artifacts 对黑板实际产物、trigger.nodes/roles 对当前节点/角色、
  #   trigger.keywords 对需求文本、trigger.intents 对节点标签集合。
  # 命中即把该技能 SKILL.md 的**全文**注入 user prompt（# 技能注入 段，位于交付契约之前）：
  # front-matter 的 steps/checkpoints/error_handling 作为提要索引在前，正文全文在后，
  # 与通用 Agent 宿主「技能命中即加载整份文档」的做法一致。
  # 同时落skill_matched 事件（含每篇 body_chars 与是否截断）+ prompts/*.md 头部的 skills=[...] 证据。
  # 目录里 sp-* 前缀的 15 个技能适配自 github.com/obra/superpowers（v7.0.0, commit bb92a77），
  # 由 `python tools/import_superpowers_skills.py` 生成（幂等），见 docs/29。
  skills:
    enabled: true
    # 技能工具（function calling）：把声明了 `tool.script` 的技能注册为 `skill_<id>` 工具，
    # 模型发起 tools/call 时由沙箱（root=技能目录）执行技能自带脚本，stdout 回灌给模型续跑。
    # 与上面的文本注入相互独立：文本注入约束「怎么做」（方法本体全文），工具调用提供
    # 「可执行动作」（scripts/*.py）；方法本体无法变成调用，只能走文本路径。
    # 开启后需配合 llm.tools_nodes 决定哪些节点下发工具（tools 与 response_format 互斥）。
    tools_enabled: true
    tools_timeout_s: 60           # 单次技能脚本执行超时（秒），独立于 sandbox_timeout
    max_items: 3                  # 单节点最多注入几个技能（按匹配度降序）
    min_score: 1                  # 匹配度阈值：1=作用域命中即注入
    # 注入段总字符预算。全文注入要求文档完整到达，因此按「满配不截断」取值：
    # max_items=3 时可能命中的正文最大的三篇（subagent-driven-development 32958 +
    # writing-skills 27148 + executing-plans 20789）合计 80895 字符，留出段头与索引
    # 开销后取 88000。0=不截断（自行承担上下文增长）。
    # 参照量级：模型上下文窗口 131072 token 起（DeepSeek），英文正文约 4 字符/token，
    # 故满配注入约占窗口 1/4 以内；实际各节点按绑定技能注入，实测 4.6k~39k 字符。
    max_chars: 88000
  prompt_artifact_max_chars: 10000  # Prompt 感知段单产物最大字符数：调高前的历史默认 900 会把 12 功能点的需求规格截到只剩 3 个 FP 片段（研发/测试/审查全程信息残缺，实测根因之一）；代码未配置时默认同为 10000
  # 上下文压缩（docs/16 的 02 文档）：默认关闭，enabled=false 时恒等返回，行为与现状逐字节一致。
  # 开启后按白名单策略做结构化压缩（保 FP 的 id/title/rules、丢 samples/parameters 等明细），
  # 并向上游事件流发 context_compressed（含 before/after 字符数）；压缩不改黑板 artifact 数据。
  context_compression:
    enabled: false
    per_item_chars: 10000        # 单产物预算
    total_chars: 32000           # 感知段总量预算；超出时按优先级裁剪低优先级明细
    llm_summary: false           # 可选 LLM 摘要（默认关：每次新增 LLM 调用都叠加网关超时风险）
  tool_result_max_chars: 4000    # tool 结果统一截断（头 60% + 尾 40%），0=不截断
  # 上下文管理（docs/35）：对齐 Codex 的 truncation + compaction 分层机制。
  # 唯一生效点是 mas/llm.py 的请求组装；未启用或未超限时 fit 原样返回，请求体逐字节不变。
  # 分层：①truncate 单条 tool 结果头尾截断 → ②trim 从最老的「工具往返」整轮丢弃
  #      → ③compact 把丢弃内容折叠成一条摘要挂回（不静默丢信息）
  #      → 仍超硬上限则标 overflow 只告警（此时是 system+user 本身超窗，再切会切坏交付契约）
  context:
    enabled: true
    compact_ratio: 0.90          # 输入 token 达可用预算的 90% 起动手（Codex auto_compact_token_limit）
    hard_ratio: 0.95             # 硬上限（Codex effective_context_window_percent）；超出只告警
    reserve_output: true         # 先从窗口扣掉 max_tokens(64000) 再算可用预算：
                                 # 不扣会把「输入撞墙」误判成「还有余量」（与 Codex 的显式分歧）
    tool_result_chars: 4000      # 阶段①单条 tool 结果预算（0=跳过该阶段）
    keep_recent_rounds: 1        # 阶段②至少保留最近几轮工具往返（整轮丢弃，保证 tool_call_id 配对）
    summary_max_chars: 2000      # 阶段③摘要字符上限
    calibrate: false             # 用端点返回的 prompt_tokens 校准字节/4 粗估（默认关：保持确定性）
  # ReAct（Reasoning + Acting）推理-行动循环：默认关闭，关闭时走改造前的工具闭环
  # （llm.tool_max_rounds），行为逐字节一致。
  # 开启后命中节点按 Thought → Action → Observation 逐步推进：模型每步先输出思考（正文），
  # 再发起 tool_calls（Action），框架经 ToolRunner 真实执行后把结果作为 Observation 回传续跑；
  # 每步落 react_step 事件（思考 + 动作 + 观察摘要），不再请求工具的那步落 react_final，
  # 步数用尽仍在要工具则落 react_step_limit 并追加一次不带 tools 的生成强制收敛。
  # 生效范围取三重交集：react.enabled + react.nodes（空=全部）+ llm.tools_nodes（工具下发白名单）。
  react:
    enabled: true               # 默认开启：命中节点按 Thought → Action → Observation 推进（docs/34）
    nodes: []                   # 空=全部节点；非空=仅这些节点走 ReAct
    max_steps: 4                # ReAct 步数上限（不含步数用尽后的收尾轮）
    thought_max_chars: 2000     # 单步思考落事件的字符上限（0=不截断；只影响留痕，不影响回传）
    observation_max_chars: 1500 # 单条观察结果落事件的字符上限（同上）
    require_thought: false      # true=某步未抽出思考时发 react_thought_missing 告警（不阻断）
  # 运行结束后的飞书通知：飞书群「自定义机器人」Webhook（stdlib urllib，零依赖）。
  # 失败只落 notify_failed 事件，不改变运行结论；webhook 为空时静默跳过。
  # 填法：群设置 → 群机器人 → 添加机器人 → 自定义机器人 → 复制 Webhook 地址。
  # 环境变量可覆盖：FEISHU_WEBHOOK_URL / FEISHU_WEBHOOK_SECRET；MAS_NOTIFY_DISABLE=1 全局静默。
  notify:
    feishu:
      enabled: true
      webhook: "https://open.feishu.cn/open-apis/bot/v2/hook/b1a4a31f-76b7-4e9a-a4bd-35da4cb0e309"
      secret: ""                             # 机器人开启「签名校验」时填；仅开关键词校验则留空
      timeout_s: 10
  # 数据存储后端（docs/25）：MySQL=索引/结构层（经验库/运行索引/产物索引），
  # Redis=跨进程协调层（运行注册表+心跳+取消键）。enabled=false 时全部走既有
  # jsonl/内存路径，行为与现状逐字节一致；任一后端连接失败也自动降级不报错。
  # 连接参数优先级：环境变量 > config/credentials.yaml 的 store 段 > 此处默认值
  # （密码只从环境变量/凭据文件注入，不写进本文件）。
  store:
    enabled: true
    mysql:
      enabled: true
      host: "127.0.0.1"            # 本机 Docker 容器 mas-mysql（-p 3306:3306）
      port: 3306
      user: "mas"
      database: "multi_agent"
      host_env: "MAS_MYSQL_HOST"
      port_env: "MAS_MYSQL_PORT"
      user_env: "MAS_MYSQL_USER"
      password_env: "MAS_MYSQL_PASSWORD"
      database_env: "MAS_MYSQL_DB"
    redis:
      enabled: true
      url: "redis://127.0.0.1:6379/0"   # 本机 Docker 容器 mas-redis（-p 6379:6379）
      url_env: "MAS_REDIS_URL"
      heartbeat_ttl_s: 90          # 运行心跳 TTL：Leader 每个节点边界续期，到期=中断
      cache_ttl_s: 15              # 读缓存 TTL（当前仅 /api/store/status 之外的预留给后续接入）
  # 消息队列（Redis Streams；连接复用 runtime.store.redis，故 store 不可用时自动降级）。
  # 解决两个真实问题：① API 与运行生命周期解耦（任务队列 + 独立 worker）；
  # ② Agent 消息走 broker 投递（每角色独立消费组，ACK + PEL 认领 + 重试 + 死信）。
  # mode: auto=优先独立 worker，无 worker 时 API 内嵌一个消费线程；queue=只入队；
  #       thread=完全走改造前的进程内线程（默认值之外的兼容通道）。
  mq:
    enabled: true
    mode: "auto"
    stream_prefix: "mas:mq"
    consumer_group: "mas-workers"
    max_attempts: 3                  # 失败重投上限，达到后进 DLQ（mas:mq:dlq:runs）
    visibility_timeout_ms: 600000    # worker 崩溃后，其 PEL 消息被其他消费者认领的空闲门槛
    retry_backoff_s: [5, 30, 120]    # 退避阶梯（秒）
    dedup_ttl_s: 86400               # 生产端幂等键 TTL（同一 run_id 不重复入队）
    stream_maxlen: 20000             # 单 Stream 近似上限，防止无限增长
    stream_ttl_s: 604800             # 7 天：按 run 隔离的 agent/events 流自动回收
    queue_ttl_s: 3600                # 排队中的运行注册键 TTL（取消按钮在领取前也生效）
    lease_ttl_s: 300                 # worker 运行租约 TTL（秒）；领取失败不 ACK，留给后续重投
    lease_renew_s: 30                # 租约续期间隔（秒），同时刷新运行心跳（长 LLM 节点不掉线）
    poll_ms: 1000                    # worker XREADGROUP 阻塞时长
    agent_bus:
      enabled: true                  # Agent 消息写 Redis Stream；关闭后只保留 jsonl 主路径
  max_steps: 40                   # 单次运行最大状态推进步数（防死循环）
  run_id_format: "%Y%m%d-%H%M%S"
  fail_fast: false
  verbose: true

files:
  flow: "flow.yaml"
  collaboration: "collaboration.yaml"
  learning: "learning.yaml"
  roles_dir: "roles"
  profiles_dir: "profiles"
