# =============================================================================
# MCP 服务配置（服务名称 / 传输方式 / 启动命令 / 参数 / 环境变量）
#
# transport: stdio —— 本地子进程，command 必填，args 为参数列表
# transport: sse   —— 远端事件流，url 必填
# env / headers 中的 ${VAR} 在运行时从环境变量展开，避免明文落盘
# 新增后可用 `python -m mas mcp check <name>` 做参数校验与握手冒烟
# =============================================================================
servers: []

