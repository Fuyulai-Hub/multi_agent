# 精简流程 Profile：关闭“代码审查”节点、收敛验收门禁、降低回退次数，
# 用于演示流程节点与协作规则的配置化裁剪（Loader 会自动重接流转边）。
flow:
  nodes:
    review:
      skip: true                 # 节点被裁剪：test 的 pass 分支自动改接到 review 的后继 acceptance
    acceptance:
      gate:
        criteria:
          - id: "用例全部通过"
            expr: "test_report.summary.failed == 0"
          - id: "功能点覆盖完整"
            expr: "test_report.coverage.functional.rate >= 1.0"
          - id: "无未关闭缺陷"
            expr: "bug_reports.open == 0"
          # SPA 判定以 ui_evidence.delivery_shape（文件探测口径）为准，证据必须由框架 probe 采集
          - id: "Web UI 断言无失败（仅 SPA 形态要求）"
            expr: "ui_evidence.delivery_shape != 'full_stack_spa' or ui_evidence.failed_asserts == 0"
          - id: "Web UI 证据非空（SPA 形态下不得证据不足）"
            expr: "ui_evidence.delivery_shape != 'full_stack_spa' or len(ui_evidence.asserts) > 0"
          - id: "SPA 浏览器证据由框架 probe 采集"
            expr: "ui_evidence.delivery_shape != 'full_stack_spa' or ui_evidence.probe_version != ''"
          - id: "SPA 证据含真实 HTTP 状态"
            expr: "ui_evidence.delivery_shape != 'full_stack_spa' or (ui_evidence.http_status >= 200 and ui_evidence.http_status < 400)"

collaboration:
  rollback:
    test:
      max_attempts: 2
    acceptance:
      max_attempts: 1

learning:
  injection:
    max_total_tokens: 600

system:
  name: "配置驱动多 Agent 任务协作系统（精简流程）"
